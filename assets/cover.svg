<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="Sofiya — Mathematical Foundation of Data Science, University of Vienna. Working where mathematics, security and machine learning meet.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="210" rx="16"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="210" fill="url(#bg)"/>
    <line x1="820" y1="24" x2="820" y2="186" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(910 105)">
      <circle r="46" fill="none" stroke="#21262d" stroke-width="8"/>
      <circle r="46" fill="none" stroke="#3fb950" stroke-width="8" stroke-linecap="round" stroke-dasharray="150 289" transform="rotate(-90)"/>
