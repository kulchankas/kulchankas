    <rect x="46" y="150" width="34" height="3" rx="1.5" fill="#3fb950"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="209" rx="16" fill="none" stroke="#30363d"/>
  <text x="46" y="74" class="sans" font-size="46" font-weight="700" fill="#e6edf3">Sofiya</text>
  <text x="48" y="108" class="sans" font-size="19" fill="#adbac7">Mathematical Foundation of Data Science · University of Vienna</text>
  <text x="46" y="182" class="sans" font-size="17" fill="#8b949e">Working where mathematics, security and machine learning meet.</text>
</svg>
