<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" role="img" aria-label="/hack-me against a running app on localhost: it finds four real vulnerabilities — IDOR, missing admin auth, SQL injection, mass assignment — proves each with a live request, patches it, and re-verifies that the exploit now fails">
  <defs>
    <clipPath id="win"><rect width="1000" height="448" rx="14"/></clipPath>
    <style>
      text{white-space:pre}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:16px}
      .t{fill:#e6edf3}.dim{fill:#7d8590}.ok{fill:#3fb950}.bad{fill:#f85149}
      .agent{fill:#d2a8ff;font-weight:600}.code{fill:#79c0ff}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#win)">
    <rect width="1000" height="448" fill="#0d1117"/>
    <rect width="1000" height="42" fill="#161b22"/>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#30363d"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="447" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="500" y="26" text-anchor="middle" class="mono dim" style="font-size:14px">/hack-me · find → prove → patch → re-verify · localhost only</text>

  <g class="mono" xml:space="preserve">
    <text x="32" y="80"><tspan class="ok">$</tspan><tspan class="t"> python3 app.py &amp;   </tspan><tspan class="dim"># your running app, port 8071</tspan></text>
    <text x="32" y="106"><tspan class="ok">$</tspan><tspan class="t"> /hack-me</tspan></text>
    <text x="32" y="132"><tspan class="agent">agent</tspan><tspan class="dim"> › mapping routes · probing each risk class · told nothing about the app</tspan></text>

    <text x="32" y="176"><tspan class="bad">✗ IDOR</tspan><tspan class="t">          GET /invoices/103 as alice   → 200 (bob's invoice)   </tspan><tspan class="dim">→ </tspan><tspan class="ok">404</tspan></text>
    <text x="32" y="204"><tspan class="bad">✗ broken auth</tspan><tspan class="t">   GET /admin/users as alice      → 200 (full dump)      </tspan><tspan class="dim">→ </tspan><tspan class="ok">403</tspan></text>
    <text x="32" y="232"><tspan class="bad">✗ SQLi</tspan><tspan class="t">          /search?email=' UNION SELECT … → passwords       </tspan><tspan class="dim">→ </tspan><tspan class="ok">[]</tspan></text>
    <text x="32" y="260"><tspan class="bad">✗ mass assign</tspan><tspan class="t">   POST /profile {is_admin:1} as alice → admin   </tspan><tspan class="dim">→ </tspan><tspan class="ok">400</tspan></text>

    <text x="32" y="304"><tspan class="agent">agent</tspan><tspan class="dim"> › re-ran every exploit against the patched app:</tspan></text>
    <text x="32" y="332" class="code">         4 found · 4 proven with a live request · 4 fixed · 4 re-verified</text>
    <text x="32" y="360"><tspan class="dim">         legitimate requests still </tspan><tspan class="ok">200</tspan><tspan class="dim"> · proofs non-destructive · your app only</tspan></text>

    <text x="32" y="404"><tspan class="ok">$</tspan><tspan class="t"> npx skills add kulchankas/paranoid/skills/paranoid</tspan><tspan class="t cursor"> ▍</tspan></text>
  </g>
</svg>
