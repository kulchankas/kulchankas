<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Sofiya · Mathematical Foundation of Data Science · University of Vienna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <radialGradient id="glow" cx="0.83" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sweep{transform-box:view-box;transform-origin:830px 125px;animation:spin 5s linear infinite}
      @keyframes spin{to{transform:rotate(-360deg)}}
      .blip{animation:blip 5s ease-out infinite}
      @keyframes blip{0%,30%{opacity:.15}38%{opacity:1}100%{opacity:.15}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="url(#bg)"/>
    <rect width="1000" height="250" fill="url(#dots)" opacity="0.5"/>
    <rect width="1000" height="250" fill="url(#glow)"/>
    <g transform="translate(830 125)" fill="none" stroke="#3fb950">
      <circle r="95" stroke-opacity="0.28"/>
      <circle r="63" stroke-opacity="0.32"/>
      <circle r="31" stroke-opacity="0.38"/>
      <line x1="-110" y1="0" x2="110" y2="0" stroke-opacity="0.14"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke-opacity="0.14"/>
    </g>
    <g class="sweep">
      <path d="M830 125 L925 125 A95 95 0 0 0 897.2 57.8 Z" fill="#3fb950" fill-opacity="0.16"/>
      <line x1="830" y1="125" x2="925" y2="125" stroke="#3fb950" stroke-width="2" stroke-opacity="0.85"/>
    </g>
    <circle class="blip" cx="872" cy="90" r="5" fill="#f85149"/>
    <circle cx="800" cy="168" r="3" fill="#3fb950" fill-opacity="0.7"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="none" stroke="#30363d"/>
  <text x="48" y="60" class="mono" font-size="15" fill="#7d8590">~/kulchankas</text>
  <text x="46" y="118" class="sans" font-size="58" font-weight="700" fill="#e6edf3">Sofiya</text>
  <text x="48" y="154" class="sans" font-size="20" fill="#8b949e">Mathematical Foundation of Data Science · University of Vienna</text>
  <text x="48" y="202" class="mono" font-size="18" fill="#3fb950">› why models work, how systems break, and how to prove it<tspan class="cursor" xml:space="preserve"> ▍</tspan></text>
</svg>
